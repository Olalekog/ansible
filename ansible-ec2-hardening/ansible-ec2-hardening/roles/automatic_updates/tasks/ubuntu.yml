---
- name: Install unattended upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Configure daily package refresh and unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/99-ansible-security-upgrades
    owner: root
    group: root
    mode: '0644'
    content: |
      // Managed by Ansible. Clear earlier lists to avoid unintended origins.
      #clear Unattended-Upgrade::Allowed-Origins;
      #clear Unattended-Upgrade::Origins-Pattern;
      Unattended-Upgrade::Allowed-Origins {
        "${distro_id}:${distro_codename}-security";
        "${distro_id}ESMApps:${distro_codename}-apps-security";
        "${distro_id}ESM:${distro_codename}-infra-security";
      };
      APT::Periodic::Enable "1";
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      Unattended-Upgrade::Automatic-Reboot "false";
      Unattended-Upgrade::Remove-Unused-Dependencies "false";

- name: Enable APT security update timers
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: [apt-daily.timer, apt-daily-upgrade.timer]
  when: not ansible_check_mode

---
- name: Capture actual SSH port for the jail independently of other roles
  become: false
  ansible.builtin.shell: 'printf "%s" "$SSH_CONNECTION"'
  register: fail2ban_connection
  changed_when: false
  check_mode: false

- name: Require SSH port information
  ansible.builtin.assert:
    that: fail2ban_connection.stdout.split() | length == 4

- name: Validate ban settings and trusted addresses
  ansible.builtin.assert:
    that:
      - fail2ban_maxretry | int > 0
      - fail2ban_findtime | int > 0
      - fail2ban_bantime | int > 0
      - fail2ban_trusted_ips is sequence and fail2ban_trusted_ips is not string
    fail_msg: Provide positive numeric ban settings and a list of trusted IPs/CIDRs.

- name: Refresh Ubuntu package metadata
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts.distribution == 'Ubuntu'

- name: Install fail2ban, journal bindings and nftables from configured repositories
  ansible.builtin.package:
    name:
      - fail2ban
      - python3-systemd
      - nftables
    state: present
  # RHEL needs an approved EPEL or mirrored repository providing fail2ban.
  # Fail explicitly if unavailable; never silently skip protection.

- name: Install SSH jail
  ansible.builtin.template:
    src: sshd.local.j2
    dest: /etc/fail2ban/jail.d/99-ansible-sshd.local
    owner: root
    group: root
    mode: '0640'
  notify: Restart fail2ban

- name: Validate aggregate fail2ban configuration before starting or restarting
  ansible.builtin.command: fail2ban-client -t
  changed_when: false
  when: not ansible_check_mode

- name: Enable and start fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    enabled: true
    state: started
  when: not ansible_check_mode

- name: Apply SSH jail before verifying
  ansible.builtin.meta: flush_handlers

- name: Verify running SSH jail
  ansible.builtin.command: fail2ban-client status sshd
  changed_when: false
  when: not ansible_check_mode
